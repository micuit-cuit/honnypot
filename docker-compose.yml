version: '3.8'

services:
  honeypot:
    build: .
    image: ssh-honeypot:bun
    container_name: ssh-honeypot-bun
    restart: unless-stopped
    ports:
      - "22:22"
    volumes:
      # Montage du dossier logs en read-write
      - ./logs:/app/logs:rw
      # Montage des fichiers de config en lecture seule
      - ./filesystem_config.txt:/app/filesystem_config.txt:ro
      - ./header.txt:/app/header.txt:ro
      # Montage des clés SSH si elles existent
      - ./host.key:/app/host.key:ro
      - ./host.key.pub:/app/host.key.pub:ro
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /app/temp:noexec,nosuid,size=50m
    user: "1001:1001"
